name: Scan internships

on:
  schedule:
    - cron: "0 13 * * *"   # daily, 13:00 UTC (6am PT / 9pm SGT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: internships
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan career pages
        run: python3 scripts/scan_internships.py
      - name: Commit results
        run: |
          git config user.name "internship-bot"
          git config user.email "internship-bot@users.noreply.github.com"
          git add data/internships.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily internship scan: $(date -u +%F)"
          git pull --rebase --autostash
          git push
